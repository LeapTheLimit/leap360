version: "3.9"

# Leap360 — local-first stack (SQLite, no Postgres/Redis required)
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: leap360-api
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: file:/data/leap360.db
      LEAP360_API_KEY: ${LEAP360_API_KEY:-leap360-dev-secret-key-change-me}
      SEED_PROJECT_ID: ${SEED_PROJECT_ID:-00000000-0000-0000-0000-000000000001}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@leap360.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: 4000
    volumes:
      - sqlite_data:/data
    command: sh -c "npx prisma migrate deploy && node dist/seed.js && node dist/server.js"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: leap360-web
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  sqlite_data:
